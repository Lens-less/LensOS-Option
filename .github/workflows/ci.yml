name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m compileall -q crypto_options_report tools
      - run: python -m pytest -q
      - run: python -m crypto_options_report.api --smoke
      - run: python -m pip wheel --no-deps . -w dist
      - name: Verify built wheel on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m venv wheel-venv
          wheel-venv/bin/python -m pip install --no-deps dist/*.whl
          wheel-venv/bin/python -m pip check
          wheel-venv/bin/crypto-options-report --help >/dev/null
          wheel-venv/bin/crypto-options-report-api --smoke >/dev/null
          wheel-venv/bin/crypto-options-snapshot-sidecar --help >/dev/null
      - name: Verify built wheel on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv wheel-venv
          $wheel = (Get-ChildItem -LiteralPath dist -Filter *.whl -File -ErrorAction Stop).FullName
          wheel-venv\Scripts\python.exe -m pip install --no-deps $wheel
          wheel-venv\Scripts\python.exe -m pip check
          wheel-venv\Scripts\crypto-options-report.exe --help | Out-Null
          wheel-venv\Scripts\crypto-options-report-api.exe --smoke | Out-Null
          wheel-venv\Scripts\crypto-options-snapshot-sidecar.exe --help | Out-Null
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        with:
          name: python-wheel
          path: dist/*.whl
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag crypto-options-research-console:ci .
      - name: Verify production container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm crypto-options-research-console:ci \
            python -m crypto_options_report.snapshot_sidecar --help >/dev/null
          docker run --detach --name crypto-options-research-console-ci \
            --env CRYPTO_OPTIONS_API_ALLOW_REMOTE=1 \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --publish 127.0.0.1:18000:8000 \
            crypto-options-research-console:ci \
            python -m crypto_options_report.api --runtime-profile production \
              --host 0.0.0.0 --port 8000
          trap 'docker logs crypto-options-research-console-ci; docker rm --force crypto-options-research-console-ci' EXIT

          alive=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18000/livez >/dev/null; then
              alive=true
              break
            fi
            sleep 1
          done
          test "$alive" = true
          ready_status="$(curl --silent --show-error --output ready.json --write-out '%{http_code}' http://127.0.0.1:18000/readyz)"
          test "$ready_status" = 503
          python - <<'PY'
          import json

          with open("ready.json", encoding="utf-8") as handle:
              ready = json.load(handle)

          assert ready["runtime_profile"] == "production"
          assert ready["service_ready"] is True
          assert ready["research_only"] is True
          assert ready["product_release"] == "NO-GO"
          assert ready["live_order_adapter_available"] is False

          fail_closed_fields = {
              "ready",
              "dependencies_ready",
              "market_provider_ready",
              "last_trusted_snapshot_ready",
              "market_data_ready",
              "account_data_ready",
              "store_ready",
              "queue_ready",
              "model_ready",
          }
          assert all(ready.get(field) is False for field in fail_closed_fields)

          required_reasons = {
              "MARKET_PROVIDER_NOT_READY",
              "MARKET_DATA_NOT_READY",
              "ACCOUNT_DATA_NOT_READY",
              "BACKTEST_STORE_NOT_READY",
              "BACKTEST_QUEUE_NOT_READY",
              "MODEL_NOT_READY",
          }
          assert required_reasons.issubset(set(ready["reason_codes"]))
          PY
          curl --fail --silent --show-error http://127.0.0.1:18000/dashboard.html >/dev/null
          healthy=false
          for attempt in {1..45}; do
            health="$(docker inspect --format='{{.State.Health.Status}}' crypto-options-research-console-ci)"
            if test "$health" = healthy; then
              healthy=true
              break
            fi
            test "$health" != unhealthy
            sleep 1
          done
          test "$healthy" = true
