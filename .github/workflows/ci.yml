name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check crypto_options_report tools tests
      - run: python -m compileall -q crypto_options_report tools
      - run: node --version
      - run: python -m pytest -q
      - run: python -m crypto_options_report.api --smoke
      - run: python -m crypto_options_report.account_snapshot_sidecar --help
      - run: python -m pip wheel --no-deps . -w dist
      - name: Verify built wheel on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m venv wheel-venv
          wheel-venv/bin/python -m pip install --no-deps dist/*.whl
          wheel-venv/bin/python -m pip check
          wheel-venv/bin/crypto-options-report --help >/dev/null
          wheel-venv/bin/crypto-options-report-api --smoke >/dev/null
          wheel-venv/bin/crypto-options-snapshot-sidecar --help >/dev/null
          wheel-venv/bin/crypto-options-account-snapshot-sidecar --help >/dev/null
      - name: Verify built wheel on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv wheel-venv
          $wheel = (Get-ChildItem -LiteralPath dist -Filter *.whl -File -ErrorAction Stop).FullName
          wheel-venv\Scripts\python.exe -m pip install --no-deps $wheel
          wheel-venv\Scripts\python.exe -m pip check
          wheel-venv\Scripts\crypto-options-report.exe --help | Out-Null
          wheel-venv\Scripts\crypto-options-report-api.exe --smoke | Out-Null
          wheel-venv\Scripts\crypto-options-snapshot-sidecar.exe --help | Out-Null
          wheel-venv\Scripts\crypto-options-account-snapshot-sidecar.exe --help | Out-Null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        with:
          name: python-wheel
          path: dist/*.whl
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Audit production npm dependencies against the official registry
        run: npm audit --omit=dev --registry=https://registry.npmjs.org --audit-level=high
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Build static public site
        run: npm run build:public
        working-directory: web
      - name: Verify public bundle excludes private surfaces
        run: npm run test:public-bundle
        working-directory: web
      - run: npm run build:extension
        working-directory: web
      - name: Verify unpacked Chrome companion artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f web/dist/chrome-extension/manifest.json
          test -f web/dist/chrome-extension/sidepanel.html
          test -f web/dist/chrome-extension/assets/service-worker.js
          test -f web/dist/chrome-extension/assets/content-script.js
      - name: Verify committed evidence bundle matches source
        run: git diff --exit-code -- crypto_options_report/static/evidence

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build --tag crypto-options-research-console:ci .
      - name: Verify production container
        shell: bash
        run: |
          set -euo pipefail
          token_dir="$(mktemp -d)"
          token_file="$token_dir/api-bearer.token"
          token_value="$(python -c 'print("T" * 32, end="")')"
          printf '%s' "$token_value" > "$token_file"
          sudo chown 10001:10001 "$token_file"
          sudo chmod 400 "$token_file"
          docker run --rm crypto-options-research-console:ci \
            python -m crypto_options_report.snapshot_sidecar --help >/dev/null
          docker run --rm crypto-options-research-console:ci \
            python -m crypto_options_report.account_snapshot_sidecar --help >/dev/null
          docker run --detach --name crypto-options-research-console-ci \
            --env CRYPTO_OPTIONS_API_ALLOW_REMOTE=1 \
            --env CRYPTO_OPTIONS_API_BEARER_TOKEN_FILE=/run/secrets/api-bearer.token \
            --mount type=bind,src="$token_file",target=/run/secrets/api-bearer.token,readonly \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --publish 127.0.0.1:18000:8000 \
            crypto-options-research-console:ci \
            python -m crypto_options_report.api --runtime-profile production \
              --host 0.0.0.0 --port 8000
          trap 'docker logs crypto-options-research-console-ci; docker rm --force crypto-options-research-console-ci' EXIT

          alive=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18000/livez >/dev/null; then
              alive=true
              break
            fi
            sleep 1
          done
          test "$alive" = true
          ready_status="$(curl --silent --show-error --output ready.json --write-out '%{http_code}' http://127.0.0.1:18000/readyz)"
          test "$ready_status" = 503
          python - <<'PY'
          import json

          with open("ready.json", encoding="utf-8") as handle:
              ready = json.load(handle)

          assert ready["runtime_profile"] == "production"
          assert ready["service_ready"] is True
          assert ready["research_only"] is True
          assert ready["product_release"] == "NO-GO"
          assert ready["live_order_adapter_available"] is False

          fail_closed_fields = {
              "ready",
              "dependencies_ready",
              "market_provider_ready",
              "last_trusted_snapshot_ready",
              "market_data_ready",
              "account_data_ready",
              "store_ready",
              "queue_ready",
              "model_ready",
          }
          assert all(ready.get(field) is False for field in fail_closed_fields)

          required_reasons = {
              "MARKET_PROVIDER_NOT_READY",
              "MARKET_DATA_NOT_READY",
              "ACCOUNT_DATA_NOT_READY",
              "BACKTEST_STORE_NOT_READY",
              "BACKTEST_QUEUE_NOT_READY",
              "MODEL_NOT_READY",
          }
          assert required_reasons.issubset(set(ready["reason_codes"]))
          PY
          console_auth="Authorization: Bearer $token_value"
          curl --fail --silent --show-error \
            --header "$console_auth" \
            http://127.0.0.1:18000/evidence >/dev/null
          curl --fail --silent --show-error \
            --header "$console_auth" \
            http://127.0.0.1:18000/dashboard.html >/dev/null
          healthy=false
          for attempt in {1..45}; do
            health="$(docker inspect --format='{{.State.Health.Status}}' crypto-options-research-console-ci)"
            if test "$health" = healthy; then
              healthy=true
              break
            fi
            test "$health" != unhealthy
            sleep 1
          done
          test "$healthy" = true
