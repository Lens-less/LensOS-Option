name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to validate and publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Verify release tag
        shell: bash
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Release tag must start with v: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify Python release surface
        run: |
          python tools/check_release_versions.py --tag "$RELEASE_TAG"
          python -m pip install --upgrade -c constraints.txt pip setuptools
          python -m pip install --no-build-isolation -c constraints.txt -e ".[dev]"
          python -m ruff check crypto_options_report tools tests
          python -m mypy --no-incremental
          python -m pytest -q
          python -m crypto_options_report.api --smoke >/dev/null
          python tools/reproduce_research.py --check

      - name: Verify and build web release surfaces
        working-directory: web
        run: |
          npm ci
          npm audit --omit=dev --registry=https://registry.npmjs.org --audit-level=high
          npm test
          npm run lint
          npm run build
          npm run build:public
          npm run test:public-bundle
          npm run build:extension

      - name: Build and verify final wheel
        run: |
          mkdir release
          python -m pip wheel --no-build-isolation --no-deps . -w release
          python tools/check_release_versions.py --tag "$RELEASE_TAG" --wheel release/*.whl --extension-dir web/dist/chrome-extension
          python -m venv wheel-venv
          wheel-venv/bin/python -m pip install --no-index --no-deps release/*.whl
          python tools/check_installed_wheel.py --python wheel-venv/bin/python

      - name: Install and verify Chinese fonts for browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk fontconfig
          fc-match 'sans-serif:lang=zh-cn'
          fc-match --format='%{family}' 'sans-serif:lang=zh-cn' | grep --quiet 'Noto Sans CJK'

      - name: Verify installed release wheel in isolated Chrome
        run: node tools/browser-smoke.mjs --python "${{ github.workspace }}/wheel-venv/bin/python" --extension-dir web/dist/chrome-extension --public-build-dir web/dist-public --output-dir browser-artifacts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-browser-acceptance
          path: browser-artifacts/
          if-no-files-found: ignore

      - name: Package Chrome extension and checksums
        run: |
          git diff --exit-code -- crypto_options_report/static/evidence
          test -f web/dist/chrome-extension/manifest.json
          test -f web/dist/chrome-extension/sidepanel.html
          (
            cd web/dist/chrome-extension
            zip -q -r "../../../release/lensos-option-chrome-extension-${RELEASE_TAG}.zip" .
          )
          python tools/check_release_versions.py --tag "$RELEASE_TAG" --wheel release/*.whl --extension-zip "release/lensos-option-chrome-extension-${RELEASE_TAG}.zip"
          (
            cd release
            sha256sum -- *.whl *.zip > SHA256SUMS
          )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG"
          release-assets/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --notes-file "docs/releases/${RELEASE_TAG}.md"
          --title "$RELEASE_TAG"
